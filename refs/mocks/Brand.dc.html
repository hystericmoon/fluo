<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Brand and splash</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#09090B}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#09090B;color:#FAFAFA;font-family:'Inter',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:24px 20px 40px;overflow:hidden">

<div style="flex-grow:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px">
<h1 style="margin:0;font-family:'Lexend',system-ui,sans-serif;font-weight:600;font-size:56px;letter-spacing:0.14em;padding-left:0.14em;line-height:1;color:#C8FF3D">FLUO</h1>
<p style="margin:0;font-size:15px;color:#A1A1AA;text-align:center;max-width:240px;line-height:1.4">Screenshots in, review out.</p>
</div>

<div style="display:flex;flex-direction:column;align-items:center;gap:12px">
<div role="img" aria-label="Fluo app icon" style="position:relative;width:96px;height:96px;border-radius:22px;background:#09090B;border:1px solid #2E2E33;display:flex;align-items:center;justify-content:center">
<span style="display:grid;grid-template-columns:auto auto;font-family:'Lexend',system-ui,sans-serif;font-weight:800;font-size:36px;line-height:0.9;color:#C8FF3D;text-align:center"><i style="font-style:normal">F</i><i style="font-style:normal">L</i><i style="font-style:normal">U</i><i style="font-style:normal">O</i></span>
</div>
<span style="font-size:13px;color:#A1A1AA">App icon, dark tile</span>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
