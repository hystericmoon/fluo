<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Albums</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#09090B}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:2px solid #C8FF3D;outline-offset:2px}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#09090B;color:#FAFAFA;font-family:'Inter',system-ui,sans-serif;display:flex;flex-direction:column;padding:24px 20px;gap:20px;overflow:hidden">

<header style="display:flex;align-items:center;gap:10px">
<h1 style="margin:0;font-size:28px;font-weight:600;letter-spacing:-0.02em;flex-grow:1">Albums</h1>
<a href="Settings.dc.html" aria-label="Settings" style="width:44px;height:44px;box-sizing:border-box;border-radius:10px;border:1px solid #6B6B76;color:#FAFAFA;display:flex;align-items:center;justify-content:center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h8M19 6h1M4 12h2M11 12h9M4 18h9M18 18h2"/><circle cx="15" cy="6" r="2.2"/><circle cx="8.5" cy="12" r="2.2"/><circle cx="15.5" cy="18" r="2.2"/></svg>
</a>
<button type="button" style="height:44px;padding:0 16px;border-radius:10px;border:0;background:#C8FF3D;color:#0B0B0F;font-family:'Inter',system-ui,sans-serif;font-size:15px;font-weight:500;display:flex;align-items:center;gap:8px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
New album
</button>
</header>

<section aria-label="Active session" style="border:1px solid #C8FF3D;border-radius:16px;background:#1B2508;padding:16px;display:flex;flex-direction:column;gap:12px">
<div style="display:flex;align-items:center;gap:8px">
<span style="width:8px;height:8px;border-radius:50%;background:#C8FF3D"></span>
<span style="font-size:13px;font-weight:500;color:#D8FF85">Session on</span>
</div>
<div>
<div style="font-size:17px;font-weight:600">Checkout flow review</div>
<div style="font-size:14px;color:#A1A1AA;margin-top:2px">New screenshots land here automatically</div>
</div>
<div style="display:flex;gap:8px">
<a href="Triage.dc.html" style="flex-grow:1;height:44px;border-radius:10px;background:#C8FF3D;color:#0B0B0F;font-size:15px;font-weight:500;display:flex;align-items:center;justify-content:center">Review 7 new</a>
<button type="button" style="height:44px;padding:0 18px;border-radius:10px;border:1px solid #6B6B76;background:transparent;color:#FAFAFA;font-family:'Inter',system-ui,sans-serif;font-size:15px;font-weight:500">Pause</button>
</div>
</section>

<div style="display:flex;flex-direction:column;gap:10px">
<h2 style="margin:0;font-size:13px;font-weight:500;color:#A1A1AA">All albums</h2>
<ul style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px">
<sc-for list="{{albums}}" as="a" hint-placeholder-count="5">
<li>
<a href="Grid.dc.html" style="display:flex;align-items:center;gap:12px;padding:12px;border:1px solid #2E2E33;border-radius:14px;background:#18181B">
<span style="display:flex;gap:4px">
<span style="width:34px;height:60px;box-sizing:border-box;border-radius:5px;background:#202024;border:1px solid #2E2E33;padding:5px;display:flex;flex-direction:column;gap:3px"><span style="height:4px;border-radius:2px;background:#3F3F46"></span><span style="height:4px;width:60%;border-radius:2px;background:#3F3F46"></span><span style="flex-grow:1"></span><span style="height:8px;border-radius:3px;background:#C8FF3D"></span></span>
<span style="width:34px;height:60px;box-sizing:border-box;border-radius:5px;background:#202024;border:1px solid #2E2E33;padding:5px;display:flex;flex-direction:column;gap:3px"><span style="height:4px;border-radius:2px;background:#3F3F46"></span><span style="height:4px;width:60%;border-radius:2px;background:#3F3F46"></span><span style="flex-grow:1"></span><span style="height:8px;border-radius:3px;background:#3F3F46"></span></span>
<span style="width:34px;height:60px;box-sizing:border-box;border-radius:5px;background:#202024;border:1px solid #2E2E33;padding:5px;display:flex;flex-direction:column;gap:3px"><span style="height:4px;border-radius:2px;background:#3F3F46"></span><span style="height:4px;width:60%;border-radius:2px;background:#3F3F46"></span><span style="flex-grow:1"></span><span style="height:8px;border-radius:3px;background:#3F3F46"></span></span>
</span>
<span style="flex-grow:1;min-width:0">
<span style="display:block;font-size:16px;font-weight:500">{{a.name}}</span>
<span style="display:block;font-size:13px;color:#A1A1AA;margin-top:3px">{{a.meta}}</span>
</span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8E8E98" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
</a>
</li>
</sc-for>
</ul>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      albums: [
        { name: 'Checkout flow review', meta: '19 screens · Today' },
        { name: 'Onboarding audit', meta: '12 screens · Mon' },
        { name: 'Settings and profile', meta: '9 screens · Last week' },
        { name: 'Search and filters', meta: '5 screens · Oct 28' },
        { name: 'Notifications', meta: '14 screens · Oct 12' }
      ]
    };
  }
}
</script>
</body>
</html>
